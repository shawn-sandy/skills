name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spec-compliance sweep
        run: bash tests/validate-all.sh
      - name: Install smoke test
        run: bash tests/verify-install.sh
